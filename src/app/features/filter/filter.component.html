<div class="tool-header">
    <p>Filter-Übersicht</p>
</div>

<div #filterGroupTable class="table-container">
  <div class="tool-toolbar">
    <mat-slide-toggle (change)="enableChangeOrder()">Reihenfolge ändern</mat-slide-toggle>

    @if(isChangeMode){
      <button mat-stroked-button class="toolbar-right" [class.order-changed]="isOrderChanged" [class.order-saved]="isOrderSaved" (click)="saveChangeOrder()">Reihenfolge speichern</button>
    }@else{
      <button mat-stroked-button class="toolbar-right" (click)="addFilter()">Filter hinzufügen</button>
    }
  </div>

  <table
    mat-table
    [dataSource]="filterGroups"
    multiTemplateDataRows
    class="mat-elevation-z8 example-list"
    cdkDropList
    [cdkDropListData]="filterGroups"
    (cdkDropListDropped)="dropFilter($event)"
  >

    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>Bearbeiten</th>
      <td mat-cell *matCellDef="let filterGroup">
        @if (isChangeMode) {
          <button mat-icon-button matTooltip="Bewegen">
            <mat-icon svgIcon="drag_pan_icon">drag_pan</mat-icon>
          </button>
        }@else{
          <button mat-icon-button matTooltip="Bearbeiten" (click)="editFilter($event, filterGroup)">
            <mat-icon>edit</mat-icon>
          </button>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let filterGroup">@if(!filterGroup.edit)
        {
          {{filterGroup.name}}
        }@else{
          <mat-form-field class="table-input" color="accent">
            <mat-label for="name">Name</mat-label>
            <input matInput  [(ngModel)]="filterGroup.nameInput" [value]="filterGroup.name" (click)="$event.stopPropagation();">
          </mat-form-field>
      }
      </td>
    </ng-container>

    <ng-container matColumnDef="live">
      <th mat-header-cell *matHeaderCellDef> Live </th>
      <td mat-cell *matCellDef="let filterGroup">
        @if(filterGroup.edit) {
          <mat-checkbox [(ngModel)]="filterGroup.liveInput" (click)="$event.stopPropagation();"></mat-checkbox>
        }@else{
        <app-live-icon [live]="filterGroup.live"></app-live-icon>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Aktionen</th>
      <td mat-cell *matCellDef="let filterGroup">@if(!filterGroup.edit){
        <button mat-icon-button matTooltip="Löschen" (click)="deleteFilter($event, filterGroup)">
          <mat-icon>delete</mat-icon>
        </button>
      }@else {
        <button mat-icon-button matTooltip="Rückgängig" (click)="cancelEditFilter($event, filterGroup)">
          <mat-icon>cancel</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Speichern" (click)="saveFilter($event, filterGroup)">
          <mat-icon>save</mat-icon>
        </button>
      }
      </td>
    </ng-container>


    <ng-container matColumnDef="expand">
      <th mat-header-cell *matHeaderCellDef aria-label="row actions">Unterfilter</th>
      <td mat-cell *matCellDef="let filterGroup">
        <button *ngIf="!filterGroup.new && !isChangeMode" mat-icon-button aria-label="expand row" >
          @if (expandedElement === filterGroup) {
            <mat-icon>keyboard_arrow_up</mat-icon>
          } @else {
            <mat-icon>keyboard_arrow_down</mat-icon>
          }
        </button>
      </td>
    </ng-container>


    <!-- Subfilter colapsed table -->
    <ng-container matColumnDef="expandedDetail">
      <td mat-cell *matCellDef="let filterGroup" [attr.colspan]="columnsToDisplayWithExpand.length">
        <div *ngIf="!filterGroup.new" class="example-element-detail"
              [@detailExpand]="filterGroup === expandedElement ? 'expanded' : 'collapsed'">
          <div class="detail-table">
            
            <app-subfilter [subfilters]="filterGroup.subfilters" [filterId]="filterGroup.id"></app-subfilter>
          </div>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
    <tr 
      mat-row
      *matRowDef="let filterGroup; columns: columnsToDisplayWithExpand;let i = dataIndex"
      class="client-row example-box"
      [class.even-row]="!(i % 2)"
      [class.example-expanded-row]="expandedElement === filterGroup"
      (click)="collapseRow($event, filterGroup)"
      cdkDrag
      [cdkDragDisabled]="!isChangeMode"
      >
        <div
          class="example-custom-placeholder"
          [ngStyle]="getPlaceholderStyle(filterGroupTable.offsetWidth)"
          *cdkDragPlaceholder 
        >
        </div>
        
    </tr>
    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
  </table>
</div>
