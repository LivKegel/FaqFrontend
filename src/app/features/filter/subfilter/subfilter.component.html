<div class="tool-toolbar">
  <mat-slide-toggle (change)="enableChangeOrder()">Reihenfolge ändern</mat-slide-toggle>

  @if(isChangeMode){
    <button mat-stroked-button class="toolbar-right" [class.order-changed]="isOrderChanged" [class.order-saved]="isOrderSaved" (click)="saveChangeOrder()">Reihenfolge speichern</button>
  }@else{
    <button mat-stroked-button class="toolbar-right" (click)="addSubfilter()">Unterfilter hinzufügen</button>
  }
</div>
<div #subfilterGroupTable class="table-container">
  <table 
    mat-table 
    [dataSource]="subfilters"
    cdkDropList
    [cdkDropListData]="subfilters"
    (cdkDropListDropped)="dropFilter($event)"
    class="mat-elevation-z8">
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef>Bearbeiten</th>
      <td mat-cell *matCellDef="let element">
        @if (isChangeMode) {
          <button mat-icon-button matTooltip="Bewegen">
            <mat-icon svgIcon="drag_pan_icon">drag_pan</mat-icon>
          </button>
        }@else{
          <button mat-icon-button matTooltip="Bearbeiten" (click)="editSubfilter($event, element)">
            <mat-icon>edit</mat-icon>
          </button>
        }
      </td>
    </ng-container>
    
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element">@if(!element.edit)
        {
          {{element.name}}
        }@else{
          <mat-form-field class="table-input" color="accent">
            <mat-label for="name">Name</mat-label>
            <input matInput  [(ngModel)]="element.nameInput" [value]="element.name" (click)="$event.stopPropagation();">
          </mat-form-field>
      }
      </td>
    </ng-container>

    <ng-container matColumnDef="live">
      <th mat-header-cell *matHeaderCellDef> Live </th>
      <td mat-cell *matCellDef="let element">
        @if(element.edit) {
          <mat-checkbox [(ngModel)]="element.liveInput" (click)="$event.stopPropagation();"></mat-checkbox>
        }@else{
        <app-live-icon [live]="element.live"></app-live-icon>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Aktionen</th>
      <td mat-cell *matCellDef="let element">@if(!element.edit){
        <button mat-icon-button matTooltip="Löschen" (click)="deleteSubfilter($event, element)">
          <mat-icon>delete</mat-icon>
        </button>
      }@else {
        <button mat-icon-button matTooltip="Rückgängig" (click)="cancelEditSubfilter($event, element)">
          <mat-icon>cancel</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Speichern" (click)="saveFilter($event, element)">
          <mat-icon>save</mat-icon>
        </button>
      }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="subfuilterColumns"></tr>
    <tr class="client-row" [class.even-row]="even" mat-row *matRowDef="let row; columns: subfuilterColumns; let even = even"
    cdkDrag
    [cdkDragDisabled]="!isChangeMode"
    >
      <div
        class="example-custom-placeholder"
        [ngStyle]="getPlaceholderStyle(subfilterGroupTable.offsetWidth)"
        *cdkDragPlaceholder 
      >
      </div>></tr>

  </table>
</div>
