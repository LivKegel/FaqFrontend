<div class="tool-header">
  <p>Fragen-Übersicht</p>

</div>




<div class="table-container">
  <div class="tool-toolbar">
    <button mat-stroked-button class="toolbar-right" (click)="addQuestion()">Frage hinzufügen</button>
  </div>
  @defer () {
    <table mat-table [dataSource]="questionsAnswers" class="mat-elevation-z8">
      

      <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->
      <!-- Position Column -->
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let element"> 
          <button mat-icon-button (click)="editQuestion(element)"> 
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container> 


      <!-- Name Column -->
      <ng-container matColumnDef="question">
        <th mat-header-cell *matHeaderCellDef> Frage </th>
        <td mat-cell *matCellDef="let element">{{element.question}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Datum </th>
        <td mat-cell *matCellDef="let element"> {{element.create_date | date: 'dd.MM.yyyy' }}</td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="live">
        <th mat-header-cell *matHeaderCellDef> Live </th>
        <td mat-cell *matCellDef="let element">
          <app-live-icon [live]="element.live"></app-live-icon>
        </td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element"> {{element.status}} </td>
      </ng-container>
      <ng-container matColumnDef="quick_note">
        <th mat-header-cell *matHeaderCellDef> Notiz </th>
        <td mat-cell *matCellDef="let element"> {{element.quick_note}} </td>
      </ng-container>

      <ng-container matColumnDef="approved">
        <th mat-header-cell *matHeaderCellDef> Freigabe </th>
        <td mat-cell *matCellDef="let element"> {{element.approved}} </td>
      </ng-container>

      <ng-container matColumnDef="live_valid_to">
        <th mat-header-cell *matHeaderCellDef> Live bis </th>
        <td mat-cell *matCellDef="let element"> {{element.live_valid_to }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr class="client-row" [class.even-row]="even" mat-row *matRowDef="let row; columns: displayedColumns; let even=even"></tr>

      
    </table>
  }
  <mat-paginator #paginator
  class="paginator"
  (page)="handlePageEvent($event)"
  [length]="apiResult.count"
  [pageSize]="10"
  [showFirstLastButtons]="true"
  [pageSizeOptions]="[10,25,50]"
  aria-label="Select page">
  </mat-paginator>
</div>
