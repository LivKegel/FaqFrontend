<mat-form-field class="select-field" color="accent">
    <mat-label for="label">{{label}}</mat-label>
    <mat-select name="label" [multiple]="multiple" [formControl]="formControl" >
      @for (option of options; track $index) {
      <mat-option value="{{ option.value }}">{{ option.display }}</mat-option>
      }
    </mat-select>
</mat-form-field>
